name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Least privilege by default; only `publish` widens this.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. Never cancel
# on main, since those runs publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.4.3
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.21.2
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # ──────────────────────────────────────────────
  #  Python: style, tests, dependency CVEs
  # ──────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github src tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Floor is set just below the current 80% so it catches regressions
      # without blocking on the day it lands. Raise it as tests are added.
      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  audit-deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      # Fails the build on a known CVE in a pinned dependency. If a finding
      # has no fix available yet, add `--ignore-vuln <GHSA-id>` with a comment
      # rather than deleting this step.
      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  # ──────────────────────────────────────────────
  #  Infrastructure: Terraform + Kubernetes
  # ──────────────────────────────────────────────
  validate-infra:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      # -backend=false keeps init offline: no state access and no cloud
      # credentials needed just to type-check the configuration.
      - name: terraform validate (aks)
        working-directory: terraform/aks
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (gke)
        working-directory: terraform/gke
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: kustomize build (base)
        run: |
          docker run --rm -v "$PWD:/src" "$KUSTOMIZE_IMAGE" build /src > base.yaml
          cat base.yaml

      # The cloud overlay resolves a pinned remote git ref, so this also
      # proves that reference still builds.
      - name: kustomize build (cloud overlay)
        run: |
          docker run --rm -v "$PWD:/src" "$KUSTOMIZE_IMAGE" build /src/k8s/overlays/cloud > cloud.yaml
          cat cloud.yaml

      # kustomize only checks kustomize syntax; kubeconform checks the
      # rendered objects against the real Kubernetes API schemas.
      - name: Validate manifests against Kubernetes schemas
        run: |
          for f in base.yaml cloud.yaml; do
            echo "── $f"
            docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary -verbose < "$f"
          done

  # ──────────────────────────────────────────────
  #  Secrets
  # ──────────────────────────────────────────────
  scan-secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history, not just the worktree

      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner

  # ──────────────────────────────────────────────
  #  Image: build once, scan, then publish
  # ──────────────────────────────────────────────
  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon so Trivy can scan the exact image
      # that publish will later push.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: universal-api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking gate: any HIGH/CRITICAL that has a fix available fails here.
      # --ignore-unfixed keeps the build from being held hostage by distro
      # CVEs with no patch released yet.
      - name: Trivy scan (blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              universal-api-gateway:ci

      # Informational: everything else, including unfixed and lower severity.
      - name: Trivy full report (non-blocking)
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln,secret \
              --severity MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --format table \
              universal-api-gateway:ci

  publish:
    name: Publish to GHCR
    needs: [lint, test, audit-deps, validate-infra, scan-secrets, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layer cache populated by the `image` job, so this is a
      # cache hit rather than a genuine second build.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/poisonoakey/universal-api-gateway:${{ github.sha }}
            ghcr.io/poisonoakey/universal-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
