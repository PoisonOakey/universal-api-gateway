apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-api-gateway
  namespace: gateway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-api-gateway
  template:
    metadata:
      labels:
        app: universal-api-gateway
    spec:
      containers:
      - name: api
        image: universal-api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: config-volume
        configMap:
          name: gateway-config
