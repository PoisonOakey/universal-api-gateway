apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-api-gateway
  namespace: gateway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-api-gateway
  template:
    metadata:
      labels:
        app: universal-api-gateway
    spec:
      containers:
      - name: api
        image: universal-api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: API_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: gateway-auth
              key: API_AUTH_TOKEN
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: tmp-volume
          mountPath: /tmp
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
      volumes:
      - name: config-volume
        configMap:
          name: gateway-config
      - name: tmp-volume
        emptyDir: {}
