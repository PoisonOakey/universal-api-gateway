apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/namespace.yaml
  - k8s/api-deployment.yaml
  - k8s/services.yaml

# This automatically reads the user's config/gateway.yaml file
# and converts it into a Kubernetes ConfigMap on the fly!
configMapGenerator:
  - name: gateway-config
    namespace: gateway-system
    files:
      - gateway.yaml=config/gateway.yaml

# Disable the random hash suffix so it predictably matches the deployment
generatorOptions:
  disableNameSuffixHash: true
